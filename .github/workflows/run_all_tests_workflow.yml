name: Nanit Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NANIT_USERNAME: ${{ secrets.NANIT_USERNAME }}
      NANIT_PASSWORD: ${{ secrets.NANIT_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start mock streaming server
        run: |
          nohup python mock_services/mock_stream_server.py > server.log 2>&1 &
          sleep 5

      - name: Run tests
        run: pytest --html=report.html --self-contained-html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: report.html
